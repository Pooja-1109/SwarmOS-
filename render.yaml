# Render Infrastructure as Code Blueprint for SwarmOS
# Documentation: https://render.com/docs/yaml

services:
  # 1. SwarmOS Backend Web Service (Node.js/Express)
  - type: web
    name: swarmos-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false

  # 2. SwarmOS Frontend Static Site (React/Vite)
  - type: web
    name: swarmos-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
